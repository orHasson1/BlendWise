databases:
  - name: blendwise-db
    plan: free
    databaseName: blendwise
    user: blendwise_user

services:
  - type: web
    name: blendwise-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_oils
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blendwise-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEBUG
        value: "False"
